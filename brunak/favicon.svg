<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fond architectural épuré en noir d'encre -->
  <rect width="64" height="64" rx="14" fill="#141311" />
  
  <!-- Ligne de structure d'accent Cyan signature -->
  <line x1="8" y1="8" x2="56" y2="8" stroke="#a9e7f5" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Monogramme architectural "B" géométrique épuré -->
  <g fill="#f4f3f0">
    <!-- Poteau porteur gauche -->
    <rect x="14" y="16" width="8" height="34" rx="1" />
    
    <!-- Dalle supérieure -->
    <rect x="22" y="16" width="16" height="7" />
    <rect x="34" y="21" width="6" height="8" rx="1" />
    <rect x="22" y="27" width="15" height="6" />
    
    <!-- Dalle inférieure -->
    <rect x="36" y="31" width="6" height="13" rx="1" />
    <rect x="22" y="43" width="18" height="7" />
  </g>
  
  <!-- Bloc en porte-à-faux Cyan BRUNAK -->
  <rect x="25" y="27" width="8" height="6" fill="#a9e7f5" />
</svg>
